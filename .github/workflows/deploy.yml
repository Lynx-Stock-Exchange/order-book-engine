name: Deploy Order Book Engine

on:
  push:
    branches:
      - main

concurrency:
  group: order-book-engine-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy order-book-engine
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            cd ~/stock-exchange/order-book-engine

            echo "Pulling latest order-book-engine..."
            git fetch origin
            git checkout main
            git pull origin main

            cd ~/stock-exchange

            echo "Building only order-book-engine..."
            DOCKER_BUILDKIT=1 docker compose build order-book-engine

            echo "Restarting only order-book-engine without dependencies..."
            docker compose up -d --no-deps order-book-engine

            echo "Deployment status:"
            docker compose ps order-book-engine
